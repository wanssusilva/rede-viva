name: Ativar GitHub Pages\non:\n  push:\n    paths:\n      - '.github/workflows/enable-pages.yml'\n  workflow_dispatch:\npermissions:\n  contents: read\n  pages: write\njobs:\n  enable:\n    runs-on: ubuntu-latest\n    steps:\n      - name: Habilitar Pages por GitHub Actions\n        env:\n          GH_TOKEN: ${{ github.token }}\n        run: |\n          curl --fail-with-body --request POST --header "Accept: application/vnd.github+json" --header "Authorization: Bearer $GH_TOKEN" --header "X-GitHub-Api-Version: 2022-11-28" https://api.github.com/repos/$GITHUB_REPOSITORY/pages --data '{"build_type":"workflow","source":{"branch":"main","path":"/"}}' || true\n