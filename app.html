<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rede Viva</title></head><body><p>Abrindo Rede Viva…</p><script>(()=>{const p=["assets/doc-0.txt","assets/doc-1.txt"];Promise.all(p.map(x=>fetch(x).then(r=>{if(!r.ok)throw Error("Não foi possível abrir a Rede Viva");return r.text()}))).then(a=>{document.open();document.write(new TextDecoder().decode(Uint8Array.from(atob(a.join("")),c=>c.charCodeAt(0))));document.close()}).catch(e=>document.body.innerHTML="<p>Não foi possível carregar a Rede Viva. Atualize a página e tente novamente.</p>")})()</script></body></html>
