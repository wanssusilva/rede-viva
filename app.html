<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carregando Rede Viva</title></head><body><script>(()=>{const p=['assets/doc-0.txt','assets/doc-1.txt'];Promise.all(p.map(x=>fetch(x).then(r=>{if(!r.ok)throw Error('Falha ao carregar');return r.text()}))).then(a=>{const b=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));document.open();document.write(new TextDecoder().decode(b));document.close()}).catch(()=>document.body.innerHTML='Não foi possível abrir a Rede Viva. Atualize a página.');})();</script></body></html>
